<!DOCTYPE html>
<html>
<head>
  <title>Stockboxed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f8f4ee; color:#2d2a26; }
    .app { max-width:950px; margin:auto; padding:24px; }
    .logo { display:block; width:170px; margin:20px auto 8px; }
    h1, p { text-align:center; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:18px; margin-top:24px; }
    .card { background:white; border-radius:18px; padding:12px; box-shadow:0 8px 20px rgba(0,0,0,.08); cursor:pointer; border:3px solid transparent; }
    .card.selected { border-color:#b9935a; }
    .card img { width:100%; border-radius:14px; aspect-ratio:1/1; object-fit:cover; }
    .card h3 { text-align:center; font-size:14px; }
    .section { margin-top:28px; background:#fffaf5; padding:18px; border-radius:18px; }
    select, input, textarea { width:100%; box-sizing:border-box; padding:12px; margin-top:10px; border-radius:12px; border:1px solid #ccc; font-size:15px; }
    button { width:100%; margin-top:14px; padding:14px; border:none; border-radius:14px; background:#2d2a26; color:white; font-size:16px; }
    #output { min-height:250px; }
  </style>
</head>
<body>
<div class="app">

  <img src="stockboxed.png" class="logo">

  <h1>Stockboxed</h1>
  <p>Create polished mockup and styled stock photo prompts.</p>

  <div class="grid" id="mockupGrid"></div>

  <div class="section">
    <h2>Prompt Builder</h2>

    <label>Aesthetic</label>
    <select id="aesthetic">
      <option>Coastal</option>
      <option>Boho</option>
      <option>Modern Farmhouse</option>
      <option>Country</option>
      <option>Fun</option>
      <option>School</option>
      <option>Kids</option>
      <option>Rural Life</option>
      <option>Urban Life</option>
      <option>Nature</option>
      <option>Other</option>
    </select>

    <label>Photo Type</label>
    <select id="photoType">
      <option>Stock photo for mockup</option>
      <option>Styled stock photo only</option>
    </select>

    <label>Item Featured</label>
    <select id="item">
      <option>Mug</option>
      <option>Blanket</option>
      <option>Apron</option>
      <option>Wallpaper</option>
      <option>Towel</option>
      <option>Baseball Hat</option>
      <option>Oven Mitt</option>
      <option>Table Runner</option>
      <option>Tablecloth</option>
      <option>Message Board / Pin Board</option>
      <option>Bedding</option>
      <option>Pillows</option>
      <option>Wood Wall Sign</option>
      <option>Metal Frame</option>
      <option>Frame with Matte Board</option>
      <option>T-Shirt</option>
      <option>Sweatshirt</option>
      <option>Bomber Jacket</option>
      <option>Stanley Cup</option>
      <option>Pajamas</option>
      <option>Rug</option>
      <option>Other</option>
    </select>

    <label>Other Item</label>
    <input id="otherItem" placeholder="Only use this if you selected Other">

    <label>Output Size</label>
    <select id="size">
      <option>2500 x 2500 square, high resolution, 300 DPI</option>
      <option>2500 x 2000 landscape, high resolution, 300 DPI</option>
      <option>2000 x 2500 portrait, high resolution, 300 DPI</option>
    </select>

    <label>Extra Notes</label>
    <textarea id="notes" placeholder="Example: blank white product only, no text, no pattern, soft natural light"></textarea>

    <button onclick="generatePrompt()">Generate Prompt</button>
  </div>

  <div class="section">
    <h2>Your Prompt</h2>
    <textarea id="output" readonly></textarea>
    <button onclick="copyPrompt()">Copy Prompt</button>
    <button onclick="openChatGPT()">Open ChatGPT</button>
  </div>

</div>

<script>
const mockups = [
  ["Phone Case Coastal Tray", "phone-case-coastal-tray.png", "cream phone case on a beachy wood serving tray with coastal neutral styling"],
  ["Distressed Navy Hat", "distressed-navy-hat.png", "distressed navy baseball hat close-up, bright realistic lifestyle styling"],
  ["Wood Sign Held Landscape", "wood-sign-held-landscape.png", "24x12 landscape wood framed wall sign held in a bright neutral setting"],
  ["Beach White Tee", "beach-white-tee.png", "slightly oversized white t-shirt at the beach, close-up, muted coastal tones"],
  ["White Pillow Chair", "white-pillow-chair.png", "large plain white square pillow on a neutral chair in a bright farmhouse setting"],
  ["White Throw Blanket", "white-throw-blanket.png", "plain white throw blanket folded on a rustic bench in a bright neutral room"],
  ["Farmhouse Frame Light", "farmhouse-frame-light.png", "blank wood picture frame under a warm sconce on a bright white farmhouse wall"],
  ["White Ceramic Mug", "white-ceramic-mug.png", "plain white ceramic mug on a light wood table in a bright cozy neutral room"]
];

let selected = mockups[0];

function loadMockups() {
  const grid = document.getElementById("mockupGrid");
  grid.innerHTML = "";

  mockups.forEach((m, i) => {
    const card = document.createElement("div");
    card.className = "card" + (i === 0 ? " selected" : "");
    card.innerHTML = `<img src="${m[1]}"><h3>${m[0]}</h3>`;
    card.onclick = () => {
      document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      selected = m;
    };
    grid.appendChild(card);
  });
}

function generatePrompt() {
  const aesthetic = document.getElementById("aesthetic").value;
  const photoType = document.getElementById("photoType").value;
  const itemValue = document.getElementById("item").value;
  const otherItem = document.getElementById("otherItem").value.trim();
  const size = document.getElementById("size").value;
  const notes = document.getElementById("notes").value;

  const item = itemValue === "Other" && otherItem ? otherItem : itemValue;

  const prompt = `Create a ${photoType.toLowerCase()}.

Use this selected Stockboxed preview style as loose inspiration:
${selected[2]}

AESTHETIC:
${aesthetic}

ITEM FEATURED:
${item}

OUTPUT:
${size}

STYLE:
Bright, clean, realistic, high-end editorial stock photography. Soft natural light, gentle shadows, neutral tones, polished but believable styling, minimal clutter, boutique marketplace quality.

IMPORTANT:
The item should be blank unless specifically requested otherwise.
Do not add text, logos, graphics, patterns, colors, brand names, or lettering unless noted.
Keep the main product area fully visible, unobstructed, not cropped, not warped, and easy to use as a mockup.
Avoid harsh shadows, fake-looking AI details, distorted hands, warped surfaces, messy backgrounds, or clutter.

USER NOTES:
${notes}`;

  document.getElementById("output").value = prompt;
}

function copyPrompt() {
  const output = document.getElementById("output");
  output.select();
  document.execCommand("copy");
  alert("Prompt copied!");
}

function openChatGPT() {
  window.open("https://chat.openai.com", "_blank");
}

loadMockups();
</script>
</body>
</html>
